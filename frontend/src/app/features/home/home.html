<div class="relative h-screen w-full flex items-center justify-center overflow-hidden bg-slate-950 font-sans">

  <!-- Ambient gradient blobs -->
  <div class="absolute -top-32 -left-32 h-96 w-96 rounded-full bg-fuchsia-600/30 blur-3xl"></div>
  <div class="absolute top-1/3 -right-32 h-96 w-96 rounded-full bg-cyan-500/20 blur-3xl"></div>
  <div class="absolute bottom-0 left-1/3 h-80 w-80 rounded-full bg-indigo-600/30 blur-3xl"></div>

  <!-- Subtle grid overlay -->
  <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff08_1px,transparent_1px),linear-gradient(to_bottom,#ffffff08_1px,transparent_1px)] bg-size-[56px_56px]"></div>

  <!-- Content card -->
  <div class="relative z-10 text-center px-10 py-14 rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-2xl animate-fade-in">

    <span class="inline-flex items-center justify-center h-14 w-14 rounded-2xl bg-linear-to-br from-fuchsia-500 to-indigo-600 text-2xl shadow-lg shadow-fuchsia-500/30 mb-6">
      🖊️
    </span>

    <h1 class="text-4xl md:text-5xl font-bold text-white mb-3 tracking-tight">
      Ready to Collaborate?
    </h1>
    <p class="text-slate-400 text-lg mb-10">
      Jump into your whiteboard and start creating.
    </p>

    <button
      (click)="goToWhiteboard()"
      class="group relative inline-flex items-center gap-2 px-9 py-4 text-lg font-semibold
             text-white rounded-full overflow-hidden
             bg-linear-to-r from-fuchsia-600 to-indigo-600
             shadow-lg shadow-fuchsia-600/30
             transition-all duration-300 ease-out
             hover:shadow-xl hover:shadow-fuchsia-600/40 hover:-translate-y-0.5
             active:translate-y-0 active:scale-95"
    >
      <span class="absolute inset-0 bg-linear-to-r from-indigo-600 to-fuchsia-600 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></span>
      <span class="relative">Open Whiteboard</span>
      <span class="relative transition-transform duration-300 ease-out group-hover:translate-x-1">→</span>
    </button>

  </div>
</div>
