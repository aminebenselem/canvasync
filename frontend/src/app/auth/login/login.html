
<div class="min-h-screen bg-slate-950 flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <div
        class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl
               bg-indigo-600 text-xl font-bold text-white shadow-lg shadow-indigo-600/20">
        W
      </div>

      <h1 class="text-2xl font-semibold tracking-tight text-white">
        Welcome back
      </h1>

      <p class="mt-2 text-sm text-slate-400">
        Sign in to continue to your whiteboard
      </p>
    </div>

    <!-- Card -->
    <div class="rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl">

      <form (ngSubmit)="login()" class="space-y-5">

        <!-- Email -->
        <div>
          <label
            for="email"
            class="mb-2 block text-sm font-medium text-slate-200">
            Email
          </label>

          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3
                   text-sm text-white placeholder-slate-500 outline-none
                   transition
                   focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
          />
        </div>

        <!-- Password -->
        <div>
          <div class="mb-2 flex items-center justify-between">
            <label
              for="password"
              class="block text-sm font-medium text-slate-200">
              Password
            </label>

            <button
              type="button"
              class="text-xs text-indigo-400 transition hover:text-indigo-300">
              Forgot password?
            </button>
          </div>

          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3
                   text-sm text-white placeholder-slate-600 outline-none
                   transition
                   focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
          />
        </div>

        <!-- Error -->
        @if (error) {
          <div
            class="rounded-lg border border-red-900/50 bg-red-950/40 px-4 py-3
                   text-sm text-red-400">
            {{ error }}
          </div>
        }

        <!-- Submit -->
        <button
          type="submit"
          class="w-full rounded-lg bg-indigo-600 px-4 py-3
                 text-sm font-semibold text-white
                 shadow-lg shadow-indigo-600/20
                 transition
                 hover:bg-indigo-500
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2
                 focus:ring-offset-slate-900
                 active:scale-[0.99]">
          Sign in
        </button>

      </form>

      <!-- Register -->
      <div class="mt-6 border-t border-slate-800 pt-6 text-center">
        <p class="text-sm text-slate-400">
          Don't have an account?
          <a
            routerLink="/register"
            class="font-medium text-indigo-400 hover:text-indigo-300">
            Create one
          </a>
        </p>
      </div>

    </div>

    <p class="mt-6 text-center text-xs text-slate-600">
      © 2026 Whiteboard
    </p>

  </div>
</div>
